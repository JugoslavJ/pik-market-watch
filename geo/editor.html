<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banja Luka MZ digitizer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,Segoe UI,sans-serif}
  #wrap{display:flex;height:100%}
  #map{flex:1}
  #side{width:300px;display:flex;flex-direction:column;border-left:1px solid #ccc;background:#fafafa}
  #side h1{font-size:15px;margin:10px 12px 6px}
  .box{margin:0 12px 10px;padding:8px;background:#fff;border:1px solid #ddd;border-radius:6px}
  .box label{display:block;font-size:12px;color:#555;margin:2px 0}
  #list{flex:1;overflow-y:auto;margin:0 12px;padding:0;list-style:none}
  #list li{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #eee;cursor:pointer}
  #list li:hover{background:#eef}
  #list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #list button{border:0;background:none;cursor:pointer;font-size:13px}
  #status{padding:6px 12px;font-size:12px;color:#666;border-top:1px solid #ddd}
  .btn{margin:2px 0;padding:5px 8px;border:1px solid #bbb;border-radius:5px;background:#f6f6f6;cursor:pointer}
  .btn:hover{background:#eee}
  .btn.primary{background:#2b6cb8;color:#fff;border-color:#2b6cb8}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  #hint{font-size:12px;color:#444;margin:6px 12px}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="side">
    <h1>MZ digitizer — Banja Luka</h1>
    <div id="hint">
      <b>Click</b> map: add vertex · <b>Enter</b>/double-click: finish polygon ·
      <b>Backspace</b>: undo vertex · <b>Esc</b>: cancel
    </div>
    <div class="box">
      <label>Scan overlay opacity <span id="opval">0.55</span></label>
      <input id="opacity" type="range" min="0" max="100" value="55" style="width:100%">
      <label><input id="showOverlay" type="checkbox" checked> show scan overlay</label>
      <label><input id="showRef" type="checkbox" checked> show auto-traced rings (reference)</label>
    </div>
    <div class="box row">
      <button class="btn primary" id="finish">Finish polygon (Enter)</button>
      <button class="btn" id="cancel">Cancel (Esc)</button>
    </div>
    <div class="box row">
      <button class="btn" id="export">Export GeoJSON</button>
      <button class="btn" id="importBtn">Import GeoJSON</button>
      <input id="importFile" type="file" accept=".geojson,.json" style="display:none">
      <button class="btn" id="clearAll">Delete all</button>
    </div>
    <ul id="list"></ul>
    <div id="status">cursor: —</div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const map = L.map('map', { zoomControl: true }).setView([44.7725, 17.1905], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// georeferenced scan overlay
const overlay = L.layerGroup();
fetch('debug/overlay-bounds.json').then(r => r.json()).then(b => {
  L.imageOverlay('debug/overlay.jpg', [[b.south, b.west], [b.north, b.east]], { interactive: false, opacity: 0.55 }).addTo(overlay);
});
overlay.addTo(map);

// reference layer: auto-traced rings from the current pipeline
const refLayer = L.layerGroup();
fetch('banja-luka-mz.geojson').then(r => { if (!r.ok) throw 0; return r.json(); }).then(gj => {
  L.geoJSON(gj, {
    style: { color: '#e03030', weight: 2, fill: false, dashArray: '4 3' },
    onEachFeature: (f, l) => l.bindTooltip(`${f.properties.mz_id}: ${f.properties.name}`, { sticky: true }),
  }).addTo(refLayer);
}).catch(() => console.log('no reference geojson yet'));
refLayer.addTo(map);

document.getElementById('opacity').addEventListener('input', e => {
  const v = e.target.value / 100;
  document.getElementById('opval').textContent = v.toFixed(2);
  overlay.eachLayer(l => l.setOpacity(v));
});
document.getElementById('showOverlay').addEventListener('change', e => {
  e.target.checked ? overlay.addTo(map) : map.removeLayer(overlay);
});
document.getElementById('showRef').addEventListener('change', e => {
  e.target.checked ? refLayer.addTo(map) : map.removeLayer(refLayer);
});

map.on('mousemove', e => {
  document.getElementById('status').textContent =
    `cursor: ${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
});
// === part 2 appended below ===

// ---------- drawing state ----------
const STORE = 'mzDrawnV1';
let drawn = [];            // [{name, latlngs:[[lat,lng],...]}]
let active = [];           // vertices of the polygon being drawn
let drawLayer = L.layerGroup().addTo(map);
const drawnLayer = L.layerGroup().addTo(map);

function save() { localStorage.setItem(STORE, JSON.stringify(drawn)); }
function load() {
  try { drawn = JSON.parse(localStorage.getItem(STORE)) || []; }
  catch { drawn = []; }
}

const activeLine = L.polyline([], { color: '#1560d4', weight: 2, dashArray: '6 4' });
const activeFill = L.polygon([], { color: '#1560d4', weight: 2, fillColor: '#1560d4', fillOpacity: 0.12 });
let activeDots = L.layerGroup();

function redrawActive() {
  activeLine.setLatLngs(active);
  activeFill.setLatLngs(active);
  map.removeLayer(activeDots);
  activeDots = L.layerGroup();
  active.forEach(ll => L.circleMarker(ll, { radius: 3, color: '#1560d4', fillOpacity: 1 }).addTo(activeDots));
  activeDots.addTo(map);
  if (active.length) { activeLine.addTo(map); activeFill.addTo(map); }
  else { map.removeLayer(activeLine); map.removeLayer(activeFill); }
}

function redrawDrawn() {
  drawnLayer.clearLayers();
  drawn.forEach((d, i) => {
    const p = L.polygon(d.latlngs, {
      color: '#0a7d32', weight: 2, fillColor: '#0a7d32', fillOpacity: 0.10,
    }).addTo(drawnLayer);
    p.bindTooltip(`${i + 1}. ${d.name || '(unnamed)'}`, { sticky: true });
    p.on('click', () => zoomTo(i));
  });
  renderList();
}

function renderList() {
  const ul = document.getElementById('list');
  ul.innerHTML = '';
  drawn.forEach((d, i) => {
    const li = document.createElement('li');
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = `${i + 1}. ${d.name || '(unnamed)'} (${d.latlngs.length}v)`;
    nm.onclick = () => zoomTo(i);
    const edit = document.createElement('button');
    edit.textContent = '✎'; edit.title = 'rename';
    edit.onclick = e => { e.stopPropagation(); rename(i); };
    const del = document.createElement('button');
    del.textContent = '✖'; del.title = 'delete';
    del.onclick = e => { e.stopPropagation(); drawn.splice(i, 1); save(); redrawDrawn(); };
    li.append(nm, edit, del);
    ul.appendChild(li);
  });
}

function zoomTo(i) {
  const b = L.latLngBounds(drawn[i].latlngs);
  map.fitBounds(b, { padding: [40, 40] });
}
function rename(i) {
  const n = prompt('MZ name (Latin):', drawn[i].name || '');
  if (n !== null) { drawn[i].name = n.trim(); save(); redrawDrawn(); }
}

map.on('click', e => { active.push([e.latlng.lat, e.latlng.lng]); redrawActive(); });
map.on('dblclick', () => finish());

function finish() {
  if (active.length < 3) { if (active.length) cancel(); return; }
  const name = prompt('MZ name (Latin, e.g. "Rosulje"):', '') || '';
  drawn.push({ name: name.trim(), latlngs: active.map(ll => [ll[0], ll[1]]) });
  active = [];
  redrawActive();
  save();
  redrawDrawn();
}
function cancel() { active = []; redrawActive(); }
function undoVertex() { active.pop(); redrawActive(); }

document.getElementById('finish').onclick = finish;
document.getElementById('cancel').onclick = cancel;
document.getElementById('clearAll').onclick = () => {
  if (confirm('Delete ALL drawn polygons?')) { drawn = []; save(); redrawDrawn(); }
};
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') finish();
  else if (e.key === 'Escape') cancel();
  else if (e.key === 'Backspace' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); undoVertex(); }
});

// ---------- export / import ----------
function exportGeoJSON() {
  const fc = {
    type: 'FeatureCollection',
    features: drawn.filter(d => d.latlngs.length >= 3).map(d => {
      const ring = d.latlngs.map(ll => [+ll[1].toFixed(6), +ll[0].toFixed(6)]);
      const f = ring[0], l = ring[ring.length - 1];
      if (f[0] !== l[0] || f[1] !== l[1]) ring.push([f[0], f[1]]);
      let a = 0;
      for (let i = 0; i < ring.length - 1; i++) a += ring[i][0] * ring[i + 1][1] - ring[i + 1][0] * ring[i][1];
      if (a < 0) ring.reverse(); // RFC7946 CCW
      return { type: 'Feature', properties: { name: d.name || '' }, geometry: { type: 'Polygon', coordinates: [ring] } };
    }),
  };
  const txt = JSON.stringify(fc, null, 1);
  const blob = new Blob([txt], { type: 'application/geo+json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'banja-luka-mz-drawn.geojson';
  a.click();
  const w = window.open('', '_blank');
  if (w) { w.document.write(`<pre style="font-size:11px">${txt.replace(/</g, '&lt;')}</pre>`); }
}
document.getElementById('export').onclick = exportGeoJSON;

document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const gj = JSON.parse(r.result);
      const feats = gj.type === 'FeatureCollection' ? gj.features : [gj];
      for (const ft of feats) {
        if (!ft.geometry || ft.geometry.type !== 'Polygon') continue;
        let ring = ft.geometry.coordinates[0].map(c => [c[1], c[0]]);
        const a = ring[0], b = ring[ring.length - 1];
        if (a[0] === b[0] && a[1] === b[1]) ring = ring.slice(0, -1);
        drawn.push({ name: (ft.properties && ft.properties.name) || '', latlngs: ring });
      }
      save(); redrawDrawn();
    } catch (err) { alert('Import failed: ' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
});

load();
redrawDrawn();

</script>
</body>
</html>
