# Dependabot: weekly bump PRs for CI actions, npm deps (both workspaces) and
# image pins (Dockerfile + docker-compose.yml). Personal-scale cadence.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /scraper
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /geo/scripts
    schedule:
      interval: monthly   # offline tooling — no rush

  - package-ecosystem: docker
    directory: /scraper
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /          # picks up postgres/grafana pins in docker-compose.yml
    schedule:
      interval: weekly
