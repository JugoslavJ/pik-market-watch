name: Security audit

# Weekly supply-chain sweep, independent of code pushes: fails on HIGH/CRITICAL
# advisories in PRODUCTION dependencies. Dependabot proposes version bumps;
# this job catches anything already sitting in the lockfile between them.
# Dev-only findings stay quiet here (visible via Dependabot instead).
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC (off the crowded top-of-hour)
  workflow_dispatch:        # manual run

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci --omit=dev
      - run: npm audit --omit=dev --audit-level=high
