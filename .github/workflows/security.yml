name: Security audit

# Weekly production-dependency audit; fail on HIGH/CRITICAL advisories.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC (off the crowded top-of-hour)
  workflow_dispatch:        # manual run

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: security-audit
      cancel-in-progress: true   # a manual re-run supersedes any run already in flight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Audit production dependencies
        run: |
          npm ci --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high
