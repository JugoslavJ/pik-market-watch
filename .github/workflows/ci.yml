name: CI

on:
  push:
    branches: [main]
    paths-ignore:          # doc-only pushes don't need tests or a redeploy
      - '**.md'
      - 'docs/**'
      - 'geo/**'
  pull_request:
  workflow_dispatch:   # manual run → full test suite + redeploy of main

permissions:
  contents: read       # workflow-wide least privilege; jobs inherit unless overridden

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a hung throwaway-Postgres boot must not burn the 6 h default
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; drop the token
      # checkout MUST precede setup-node: the npm cache keys off
      # scraper/package-lock.json, which only exists after checkout.
      # Actions pinned by commit SHA like the deploy job below (Dependabot
      # keeps the SHAs + version comments current).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:syntax
      - run: npm run test:dashboards
      - run: npm test
      - run: npm run test:integration
      # Build the same application image used by Compose, then scan its OS and
      # language layers. Findings are reported first while the baseline is
      # tuned; no credentials or production environment are available here.
      - name: Build scraper image for vulnerability scanning
        run: docker build --tag pik-market-watch-scraper:ci .
      - name: Scan scraper image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pik-market-watch-scraper:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  # ── CD: deploy to the Oracle Compute instance ──────────────────────────────
  # Only runs after the suite passed for THIS exact commit, and only for pushes
  # to main (or a manual dispatch). The tracked files are shipped with
  # `git archive | ssh tar` — which can never touch the server's git-ignored
  # .env / config/searches.json / backups — and the stack is rebuilt there with
  # `docker compose up -d --build`. Building on the instance means native CPU
  # arch (no amd64/arm64 mismatch with GH runners) and no registry / PAT.
  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15   # instance stack is just db + grafana + backup
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # queue overlapping pushes; never kill a live deploy
    permissions:
      contents: read
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
      # Optional repo *variable* (Settings → Secrets and variables → Actions →
      # Variables). Must be tilde- or absolute-path style, no spaces.
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/pik-market-watch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # archive + ssh only; drop the token

      - name: Require pinned SSH host key
        env:
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${OCI_KNOWN_HOSTS:?OCI_KNOWN_HOSTS must be configured in the production environment}"
          mkdir -p ~/.ssh
          # tr -d '\r': secrets copied from Windows files carry CRLF; a
          # trailing \r corrupts every entry and strict checking would fail.
          printf '%s\n' "$OCI_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "host key pinned from OCI_KNOWN_HOSTS — strict checking armed"

      - name: Write deploy key
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${OCI_SSH_PRIVATE_KEY:?OCI_SSH_PRIVATE_KEY must be configured in the production environment}"
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key

      - name: Sync tracked files to the instance
        run: |
          SSH="ssh -i ~/.ssh/oci_deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30"
          $SSH "$OCI_USER@$OCI_HOST" "mkdir -p $DEPLOY_DIR"
          # Keep DEPLOY_DIR unquoted at the remote shell boundary so a
          # configured ~/path expands against the OCI user's home directory.
          git ls-files | $SSH "$OCI_USER@$OCI_HOST" "cat > $DEPLOY_DIR/.deploy-tracked-files.next"
          $SSH "$OCI_USER@$OCI_HOST" "DEPLOY_DIR=$DEPLOY_DIR bash -s" <<'REMOTE_CLEANUP'
          set -euo pipefail
          old="$DEPLOY_DIR/.deploy-tracked-files"
          next="$DEPLOY_DIR/.deploy-tracked-files.next"
          if [ -f "$old" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                /*|../*|*/../*|.env|config/searches.json|tls/*|backups/*|logs/*) continue ;;
              esac
              if ! grep -Fqx -- "$path" "$next"; then
                rm -f -- "$DEPLOY_DIR/$path"
              fi
            done < "$old"
          fi
          mv -f -- "$next" "$old"
          REMOTE_CLEANUP
          git archive --format=tar.gz HEAD | $SSH "$OCI_USER@$OCI_HOST" "tar -xzf - -C $DEPLOY_DIR"
          echo "Shipped $(git archive --format=tar HEAD | tar -tf - | wc -l) files to $OCI_USER@$OCI_HOST:$DEPLOY_DIR"

      - name: Rebuild stack and wait for health
        run: |
          ssh -i ~/.ssh/oci_deploy_key -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ServerAliveInterval=30 \
              "$OCI_USER@$OCI_HOST" "DEPLOY_DIR=$DEPLOY_DIR GIT_SHA=${{ github.sha }} bash -s" \
            < scripts/deploy-stack.sh
