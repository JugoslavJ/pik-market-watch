name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual run → full test suite + redeploy of main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - run: npm run lint:syntax
      - run: npm test
      - run: npm run test:integration

  # ── CD: deploy to the Oracle Compute instance ──────────────────────────────
  # Only runs after the suite passed for THIS exact commit, and only for pushes
  # to main (or a manual dispatch). The tracked files are shipped with
  # `git archive | ssh tar` — which can never touch the server's git-ignored
  # .env / config/searches.json / backups — and the stack is rebuilt there with
  # `docker compose up -d --build`. Building on the instance means native CPU
  # arch (no amd64/arm64 mismatch with GH runners) and no registry / PAT.
  deploy:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45   # first build downloads Chromium (~400 MB) on the instance
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # queue overlapping pushes; never kill a live deploy
    permissions:
      contents: read
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
      # Optional repo *variable* (Settings → Secrets and variables → Actions →
      # Variables). Must be tilde- or absolute-path style, no spaces.
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/pik-market-watch' }}
    steps:
      - uses: actions/checkout@v5

      - name: Write deploy key
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key

      - name: Sync tracked files to the instance
        run: |
          SSH="ssh -i ~/.ssh/oci_deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ServerAliveInterval=30"
          $SSH "$OCI_USER@$OCI_HOST" "mkdir -p $DEPLOY_DIR"
          git archive --format=tar.gz HEAD | $SSH "$OCI_USER@$OCI_HOST" "tar -xzf - -C $DEPLOY_DIR"
          echo "Shipped $(git archive --format=tar HEAD | tar -tf - | wc -l) files to $OCI_USER@$OCI_HOST:$DEPLOY_DIR"

      - name: Rebuild stack and wait for health
        run: |
          ssh -i ~/.ssh/oci_deploy_key \
              -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ServerAliveInterval=30 \
              "$OCI_USER@$OCI_HOST" "DEPLOY_DIR=$DEPLOY_DIR GIT_SHA=${{ github.sha }} bash -s" <<'REMOTE'
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_DIR:-$HOME/pik-market-watch}"
          cd "$DEPLOY_DIR"
          echo "▶ Deploying ${GIT_SHA:-unknown} in $(pwd) on $(hostname)"

          # One-time setup guard: these two are git-ignored, so the pipeline
          # never ships them — they must exist on the instance already.
          for f in .env config/searches.json; do
            if [ ! -f "$f" ]; then
              echo "✗ Missing $DEPLOY_DIR/$f on the instance."
              echo "  Fix once over SSH, then re-run this job:"
              echo "    cp .env.example .env                          # set the passwords"
              echo "    cp config/searches.example.json config/searches.json   # add searches"
              exit 1
            fi
          done

          # Refresh the prebuilt images (postgres/grafana pins) if the registry
          # is reachable; `up` below still works from the local cache otherwise.
          docker compose pull db grafana db-backup || echo "⚠ pull failed, using local images"

          echo "▶ docker compose up -d --build (build output below, if any)"
          docker compose up -d --build --remove-orphans

          echo "▶ Waiting for containers to become healthy (scraper start_period is 120 s)…"
          deadline=$((SECONDS + 360))
          while :; do
            db=$(docker inspect -f '{{.State.Health.Status}}' olx-db 2>/dev/null || echo missing)
            sc=$(docker inspect -f '{{.State.Health.Status}}' olx-scraper 2>/dev/null || echo missing)
            gr=$(docker inspect -f '{{.State.Status}}' olx-grafana 2>/dev/null || echo missing)
            echo "   db=$db  scraper=$sc  grafana=$gr  (t=${SECONDS}s)"
            if [ "$db" = healthy ] && [ "$sc" = healthy ] && [ "$gr" = running ]; then
              echo "✓ Stack healthy — deployed ${GIT_SHA:-unknown} to the instance"
              echo "  Grafana: http://${OCI_HOST:-<instance-ip>}:3000"
              docker image prune -f >/dev/null   # drop the dangling previous scraper image
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "✗ Health check timed out after 6 min — recent state:"
              docker compose ps -a
              docker compose logs --tail 80 db scraper grafana
              exit 1
            fi
            sleep 10
          done
          REMOTE
