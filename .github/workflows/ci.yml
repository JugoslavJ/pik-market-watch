name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Require PowerShell for executable sync tests
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      # Run the workspace unit tests once, under the unit-only coverage floor;
      # database modules are exercised by the integration run.
      - run: npm run test:coverage
      - run: npm run test:contracts
      - run: npm run test:dashboards
      - name: Build scraper image for vulnerability scanning
        run: docker build --tag pik-market-watch-scraper:ci --file collector/Dockerfile .
      - name: Scan scraper image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: pik-market-watch-scraper:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Validate the versioned Superset dashboard catalog
        working-directory: .
        run: node superset/scripts/generate-dashboard-catalog.js --check
      - name: Check deployment and backup contracts
        working-directory: .
        run: python3 -m unittest discover -v -s tests/contracts -p '*.py'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the production Superset image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: superset/Dockerfile
          tags: pik-market-watch-superset:ci
          load: true
          cache-from: type=gha,scope=superset
          cache-to: type=gha,scope=superset,mode=max
      - name: Check Superset Python assets compile
        working-directory: .
        run: >-
          docker run --rm -v "$PWD/superset:/assets:ro"
          --entrypoint python pik-market-watch-superset:ci -c
          "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p)) for p in pathlib.Path('/assets').glob('*.py')]"
      - name: Check dashboard, deployment and alert contracts
        working-directory: .
        run: >-
          docker run --rm -v "$PWD/superset:/assets:ro"
          -v "$PWD/scripts:/repo/scripts:ro" -v "$PWD/db:/repo/db:ro"
          --entrypoint python pik-market-watch-superset:ci
          -m unittest discover -v -s /assets/tests
      # One disposable database serves the integration files, then the
      # dashboard results check against a known market fixture.
      - name: Run database integration and dashboard reporting tests
        run: node db/scripts/run-integration-tests.js --with-reporting

  # Deploy tested main revisions; git archive preserves ignored instance configuration.
  deploy:
    needs: [test]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
      DEPLOY_DIR: ${{ '~/pik-market-watch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require pinned SSH host key
        env:
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${OCI_KNOWN_HOSTS:?OCI_KNOWN_HOSTS must be configured in the production environment}"
          mkdir -p ~/.ssh
          # Strip CRLF carriage returns from Windows-copied host keys.
          printf '%s\n' "$OCI_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "host key pinned from OCI_KNOWN_HOSTS — strict checking armed"

      - name: Write deploy key
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${OCI_SSH_PRIVATE_KEY:?OCI_SSH_PRIVATE_KEY must be configured in the production environment}"
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key

      - name: Sync tracked files to the instance
        run: |
          SSH="ssh -i ~/.ssh/oci_deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30"
          $SSH "$OCI_USER@$OCI_HOST" "mkdir -p $DEPLOY_DIR"
          # Keep DEPLOY_DIR unquoted at the remote shell boundary so a
          # configured ~/path expands against the OCI user's home directory.
          git ls-files | $SSH "$OCI_USER@$OCI_HOST" "cat > $DEPLOY_DIR/.deploy-tracked-files.next"
          $SSH "$OCI_USER@$OCI_HOST" "DEPLOY_DIR=$DEPLOY_DIR bash -s" <<'REMOTE_CLEANUP'
          set -euo pipefail
          old="$DEPLOY_DIR/.deploy-tracked-files"
          next="$DEPLOY_DIR/.deploy-tracked-files.next"
          if [ -f "$old" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                /*|../*|*/../*|.env|config/searches.json|tls/*|backups/*|logs/*) continue ;;
              esac
              if ! grep -Fqx -- "$path" "$next"; then
                rm -f -- "$DEPLOY_DIR/$path"
              fi
            done < "$old"
          fi
          mv -f -- "$next" "$old"
          REMOTE_CLEANUP
          git archive --format=tar.gz HEAD | $SSH "$OCI_USER@$OCI_HOST" "tar -xzf - -C $DEPLOY_DIR"
          echo "Shipped $(git archive --format=tar HEAD | tar -tf - | wc -l) files to $OCI_USER@$OCI_HOST:$DEPLOY_DIR"

      - name: Rebuild stack and wait for health
        run: |
          set -euo pipefail
          # Run the synced script as a file. Streamed over stdin, the first
          # command reading stdin (docker compose exec) swallowed the rest of
          # the script and the step passed without deploying.
          ssh -i ~/.ssh/oci_deploy_key -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ServerAliveInterval=30 \
              "$OCI_USER@$OCI_HOST" \
              "cd $DEPLOY_DIR && DEPLOY_DIR=$DEPLOY_DIR GIT_SHA=${{ github.sha }} bash scripts/deploy-stack.sh" \
            < /dev/null | tee deploy.log
          # A truncated run must fail the job, not pass it.
          grep -Fq "✓ Stack healthy — deployed ${{ github.sha }} " deploy.log
