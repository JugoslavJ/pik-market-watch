# ─────────────────────────────────────────────────────────────────────────────
# OLX.ba price tracker — 3-container stack
#   db      : PostgreSQL 16, schema auto-created on first start (db/init/*.sql)
#   scraper : Node + Playwright headless Chromium; scrapes configured searches
#             into Postgres on a schedule (default every 12 h)
#   grafana : dashboards over the database → http://localhost:3000
#
# First run:
#   cp .env.example .env                                   (edit the passwords)
#   cp config/searches.example.json config/searches.json   (add your searches)
#   docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

# Cap container logs so months of uptime can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: olx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-olx}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # runs on FIRST start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m     # plenty for a personal-scale tracker; raise if needed
    cpus: 0.50
    logging: *logging
    ports:
      - "127.0.0.1:5432:5432"   # host access for psql/GUIs; delete line to keep internal

  scraper:
    build: ./scraper
    container_name: olx-scraper
    restart: unless-stopped
    init: true                   # proper signal handling + reaps chromium zombies
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-olx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-olx}
      SCRAPE_INTERVAL_MINUTES: ${SCRAPE_INTERVAL_MINUTES:-720}
      # NOTE: do NOT add RUN_ONCE here. Combined with this service's restart
      # policy, a finished one-shot container would be relaunched forever
      # (= endless scrape loop). For one-off runs use:
      #   docker compose run --rm scraper node src/index.js --once
      HEADLESS: ${HEADLESS:-1}   # only 1 is supported: image ships headless-shell Chromium
    volumes:
      - ./config:/config:ro      # scraper reads /config/searches.json
    shm_size: 512mb              # Chromium crashes with Docker's 64 MB default
    ports:
      - "127.0.0.1:9100:9100"   # health/status JSON endpoint
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9100/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s        # browser + DB warm-up before counting failures
    mem_limit: 2g               # Chromium is the hungry one; raise if you add many searches
    cpus: 1.5
    logging: *logging

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: olx-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_ANALYTICS_REPORTUSAGE_ENABLED: "false"   # no usage telemetry
      # Consumed by env interpolation in grafana/provisioning/datasources/postgres.yml
      POSTGRES_USER: ${POSTGRES_USER:-olx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-olx}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

volumes:
  pgdata:
  grafana:
