# ─────────────────────────────────────────────────────────────────────────────
# pik-market-watch — OLX.ba price tracker
#   db      : PostgreSQL 16, schema auto-created on first start (db/init/*.sql)
#   grafana : dashboards over the database → http://localhost:3000 locally
#             HTTP-only behind Cloudflare Tunnel; public TLS terminates at Cloudflare
#   db-backup : nightly pg_dump + Grafana-state sidecar into ./backups
#
#   scraper : Node, talks to olx.ba's public JSON API (fetch, no browser) —
#             behind profile "scrape". Runs on the HOME machine: Cloudflare
#             403-challenges the API from datacenter IPs too (confirmed from
#             OCI via bare curl). One-off run:
#               docker compose --profile scrape run --rm scraper node src/index.js --once
# ─────────────────────────────────────────────────────────────────────────────

# Cap container logs so months of uptime can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Digest pin = exactly this build everywhere (Dependabot updates tag+digest).
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: olx-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true   # nothing here may gain privileges
    pids_limit: 100              # max_connections forks (40) + background workers
    # Right-size for the 768m cap (stock defaults assume a dedicated server):
    #   shared_buffers/effective_cache_size fit inside the limit; 40 conns cover
    #   the real client budget (scraper pool max 5 + Grafana maxOpenConns 20 +
    #   backup psql sessions); random_page_cost/io_concurrency assume SSD;
    #   wal_compression suits this tiny write volume.
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=40
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-olx}
      # Runtime least-privilege roles (db/init/zz-database-roles.sh):
      #   *APP*    owns schema/objects — scraper + remote restores connect as it
      #   *READER* read-only — Grafana datasource + pg_dump backups
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-olx_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:-olx_reader}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD in .env}
      POSTGRES_PUBLIC_READER_USER: ${POSTGRES_PUBLIC_READER_USER:-olx_public_reader}
      POSTGRES_PUBLIC_READER_PASSWORD: ${POSTGRES_PUBLIC_READER_PASSWORD:?set POSTGRES_PUBLIC_READER_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # runs on FIRST start only
      - ./backups:/backups                          # host-visible dump target
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m     # plenty for a personal-scale tracker; raise if needed
    memswap_limit: 768m # hit OOM decisively instead of swapping into latency spikes
    cpus: 0.50
    logging: *logging
    # Deliberately NO cap_drop/read_only here: the first-boot entrypoint chowns
    # PGDATA. Isolation comes from attaching db to the backend network ONLY.
    networks:
      - backend
    ports:
      - "127.0.0.1:5432:5432"   # host access for psql/GUIs; delete line to keep internal

  # Schema changes run as a completed, one-shot job. Keeping this separate
  # makes deploy order explicit and prevents a normal scraper restart from
  # becoming the migration control plane.
  migrator:
    build: ./scraper
    # `scrape` activates it automatically as scraper's dependency; `migrate`
    # also permits an explicit schema-only run on the dashboard host.
    profiles: ["migrate", "scrape", "maintenance"]
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 32
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-olx_app}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-olx}
    volumes:
      - ./db/init:/db/init:ro
    entrypoint: ["node", "src/migrate-only.js"]
    networks:
      - backend

  # Run retention and daily analytics independently from upstream scraping.
  # Invoke on a host scheduler with --profile maintenance.
  maintenance:
    build: ./scraper
    profiles: ["maintenance"]
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 32
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-olx_app}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-olx}
      MIGRATIONS_ON_STARTUP: "0"
      RAW_RESPONSE_RETENTION_DAYS: ${RAW_RESPONSE_RETENTION_DAYS:-3}
      ANALYTICS_REBUILD_MAX_DAYS: ${ANALYTICS_REBUILD_MAX_DAYS:-31}
    volumes:
      - ./db/init:/db/init:ro
    entrypoint: ["node", "src/maintenance-only.js"]
    networks:
      - backend

  scraper:
    build: ./scraper
    container_name: olx-scraper
    profiles: ["scrape"]         # opt-in: runs where you point COMPOSE_PROFILES at it
    restart: unless-stopped
    init: true                   # proper signal handling (cheap insurance)
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]              # pure JSON client — needs no kernel capabilities
    read_only: true              # writes live in Postgres; rootfs stays immutable
    tmpfs:
      - /tmp
    pids_limit: 64               # one node process + libuv threadpool
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-olx_app}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-olx}
      # Migrations are gated by the completed migrator job. Set this to 1
      # only for a deliberately standalone scraper deployment.
      MIGRATIONS_ON_STARTUP: ${MIGRATIONS_ON_STARTUP:-0}
      SCRAPE_INTERVAL_MINUTES: ${SCRAPE_INTERVAL_MINUTES:-720}
      DETAIL_REFRESH_DAYS: ${DETAIL_REFRESH_DAYS:-7}
      DETAIL_JOB_LEASE_MINUTES: ${DETAIL_JOB_LEASE_MINUTES:-30}
      RAW_RESPONSE_RETENTION_DAYS: ${RAW_RESPONSE_RETENTION_DAYS:-3}
      ANALYTICS_REBUILD_MAX_DAYS: ${ANALYTICS_REBUILD_MAX_DAYS:-31}
      ABANDONED_RUN_AFTER_MINUTES: ${ABANDONED_RUN_AFTER_MINUTES:-180}
      HEALTH_BIND: ${HEALTH_BIND:-0.0.0.0}
      # NOTE: do NOT add RUN_ONCE here. Combined with this service's restart
      # policy, a finished one-shot container would be relaunched forever
      # (= endless scrape loop). For one-off runs use:
      #   docker compose run --rm scraper node src/index.js --once
    volumes:
      - ./config:/config:ro      # scraper reads /config/searches.json
      - ./db/init:/db/init:ro    # fallback migrations for standalone scraper runs
    ports:
      - "127.0.0.1:9100:9100"   # health/status JSON endpoint
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9100/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s         # DB warm-up + first scrape cycle before counting failures
    mem_limit: 512m             # plain HTTP JSON client
    memswap_limit: 512m         # hit OOM decisively instead of swapping into latency spikes
    cpus: 0.50
    logging: *logging
    networks:
      - default                 # egress to olx.ba
      - backend                 # reach db

  grafana:
    # Digest pin alongside the version tag (Dependabot keeps both current).
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: olx-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]              # uid 472 on an unprivileged port needs none
    pids_limit: 128              # server + plugins (goroutines aren't PIDs)
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_ANALYTICS_REPORTUSAGE_ENABLED: "false"   # no usage telemetry
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"     # no outbound version-check pings either
      GF_SERVER_ENABLE_GZIP: "true"               # compress dashboard JSON over WAN links
      GF_LOG_LEVEL: "warn"                        # trim log IO; flip back to info when debugging
      # Cloudflare Tunnel publishes public HTTPS; Grafana stays HTTP-only on
      # the host-loopback published port.
      GF_SERVER_PROTOCOL: http
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_SERVER_ENFORCE_DOMAIN: ${GRAFANA_ENFORCE_DOMAIN:-false}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: lax
      # Public sharing is explicit per dashboard; organization-wide anonymous
      # Viewer access stays disabled because it permits arbitrary queries.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Encrypts datasource secrets at rest inside grafana.db (.env: GRAFANA_SECRET_KEY)
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?set GRAFANA_SECRET_KEY in .env}
      # Grafana's default geomap basemap uses an authenticated CARTO MapLibre
      # vector style. The key and style are injected at runtime instead of
      # being stored in dashboard JSON.
      GF_GEOMAP_DEFAULT_BASELAYER_CONFIG: >-
        {"type":"maplibre","config":{"url":"https://basemaps.cartocdn.com/gl/${GRAFANA_CARTO_VECTOR_STYLE:-dark-matter}-gl-style/style.json?key=${GRAFANA_CARTO_API_KEY:-}"}}
      # Consumed by env interpolation in grafana/provisioning/datasources/postgres.yml
      # (read-only role — Grafana never needs write access)
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:-olx_reader}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
      POSTGRES_PUBLIC_READER_USER: ${POSTGRES_PUBLIC_READER_USER:-olx_public_reader}
      POSTGRES_PUBLIC_READER_PASSWORD: ${POSTGRES_PUBLIC_READER_PASSWORD:?set POSTGRES_PUBLIC_READER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-olx}
      SCRAPE_STALE_AFTER_HOURS: ${SCRAPE_STALE_AFTER_HOURS:-26}
      # Consumed by provisioning/alerting/olx-alerts.yml (alert mail recipient).
      # Grafana 13 fatal-VALIDATES email receivers during provisioning: an empty
      # address makes the container exit (deploys stuck unhealthy). The
      # placeholder keeps boot safe; set a real ALERT_EMAIL_TO in .env to arm
      # delivery (plus GF_SMTP_* below).
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alert-not-configured@localhost}
      # Alert MAIL delivery is optional — without SMTP the rules still evaluate
      # and show firing/resolving history in the UI. Uncomment + set .env:
      # GF_SMTP_ENABLED: "true"
      # GF_SMTP_HOST: ${GRAFANA_SMTP_HOST}          # host:port, e.g. smtp.gmail.com:587
      # GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      # GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      # GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/public-dashboards:/var/lib/grafana/public-dashboards:ro
    ports:
      # Keep the host-side listener loopback-only. Production deployment
      # rejects any GRAFANA_BIND override; cloudflared is the public entry point.
      - target: 3000
        published: "3000"
        host_ip: ${GRAFANA_BIND:-127.0.0.1}
        protocol: tcp
        mode: host
    mem_limit: 768m
    memswap_limit: 768m         # hit OOM decisively instead of swapping into latency spikes
    cpus: 1.0
    logging: *logging
    networks:
      - default                 # SMTP egress (optional alert mail delivery)
      - backend                 # reach db
    healthcheck:
      # Grafana is HTTP-only; Cloudflare handles public TLS outside the host.
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-backup:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
                                         # same image as db → pg_dump always version-matched
    container_name: olx-db-backup
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]              # sh / pg_dump / tar need no capabilities
    read_only: true              # dumps land on the /backups mount only
    tmpfs:
      - /tmp
    pids_limit: 50
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_READER_USER:-olx_reader}   # read-only is enough for pg_dump
      PGPASSWORD: ${POSTGRES_READER_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-olx}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./db/backup.sh:/usr/local/bin/backup.sh:ro
      - grafana:/grafana-data:ro          # nightly tar of Grafana state (users/prefs/UI edits)
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    mem_limit: 256m
    memswap_limit: 256m         # hit OOM decisively instead of swapping into latency spikes
    logging: *logging
    networks:
      - backend
    healthcheck:
      # Semantic check: healthy ⇔ a pg_dump archive exists and is fresh (< 26 h).
      # The loop dumps right after start, so this settles within minutes; a hung
      # loop or silently failing pg_dump flips the sidecar unhealthy instead of
      # dying invisibly.
      test: ["CMD-SHELL", "find /backups -name 'olx-*.dump' -mmin -1560 -print -quit | grep -q ."]
      interval: 10m
      timeout: 10s
      retries: 3
      start_period: 5m

volumes:
  # Explicit names: Compose derives them from the repo FOLDER name when left
  # implicit, so renaming olx-price-ext → pik-market-watch would otherwise
  # abandon the existing pgdata/grafana volumes on the next `up`.
  pgdata:
    name: olx-price-ext_pgdata
  grafana:
    name: olx-price-ext_grafana

networks:
  # Segmentation: db joins ONLY `backend`, so anything on the default network
  # (today's and future containers alike) cannot resolve or reach Postgres.
  # Scraper and Grafana are dual-homed onto `default` for egress; the database
  # and backend-only jobs use this isolated network for PostgreSQL access.
  backend:
    internal: true
