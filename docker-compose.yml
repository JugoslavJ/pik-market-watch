# pik-market-watch — OLX.ba price tracker
# The scraper is opt-in via the "scrape" profile. One-off run:
#   docker compose --profile scrape run --rm scraper node src/index.js --once

# Cap container logs so months of uptime can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared by the scraper and its one-shot jobs. A single image tag lets Compose
# reuse one built image and its BuildKit cache across all four services.
x-scraper-runtime: &scraper-runtime
  image: pik-market-watch-scraper:local
  build:
    context: .
    dockerfile: collector/Dockerfile
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp
  pids_limit: 32
  # Keep all scraper and one-shot maintenance/migration jobs in the same
  # bounded resource class so scheduled jobs cannot starve dashboard traffic.
  mem_limit: 768m
  memswap_limit: 768m
  cpus: 0.50
  volumes:
    - ${DB_INIT_DIR:-./db/init-lean}:/db/init:ro
  networks:
    - backend

x-superset-environment: &superset-environment
  SUPERSET_CONFIG_PATH: /app/superset_config.py
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY in .env}
  SUPERSET_META_USER: ${SUPERSET_META_USER:-superset_meta}
  SUPERSET_META_PASSWORD: ${SUPERSET_META_PASSWORD:?set SUPERSET_META_PASSWORD in .env}
  SUPERSET_META_DB: ${SUPERSET_META_DB:-superset_meta}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  SUPERSET_COOKIE_SECURE: ${SUPERSET_COOKIE_SECURE:-false}
  SUPERSET_WEBSERVER_WORKERS: 1
  SUPERSET_ROOT_URL: ${SUPERSET_ROOT_URL:-http://localhost:3000/}
  MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}

services:
  db:
    # PostGIS-enabled PostgreSQL 18 image. Digest pin = exactly this build
    # everywhere (refresh tag+digest together when upgrading PostGIS).
    image: ghcr.io/baosystems/postgis:18-3.6@sha256:4117c8beae9081e76a23a1577c64d05260a61fb0a3c212f37596054ef4c190d8
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 100 # max_connections forks (40) + background workers
    # Cap PostgreSQL at 0.75 OCPU and 2 GiB RAM on the 2 OCPU / 12 GiB VM,
    # leaving headroom for the viewer backend, jobs, and the host OS.
    # The 40-connection cap covers scraper, Superset, backup, and tools.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=40
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      # The synchronized restore uses one transaction for lean application
      # objects and their PostGIS extension dependencies.
      - -c
      - max_locks_per_transaction=512
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-olx}
      # Runtime least-privilege roles (db/init-lean/zz-database-roles.sh):
      #   *MIGRATOR* owns schema/objects — migrations and restores only
      #   *APP*      runtime writer — scraper and maintenance
      #   *REPORTING* read-only lean-table access — React viewer and Superset
      #   *BACKUP*   broad read-only — pg_dump only
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-olx_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-olx_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_REPORTING_USER: ${POSTGRES_REPORTING_USER:-olx_reporting}
      POSTGRES_REPORTING_PASSWORD: ${POSTGRES_REPORTING_PASSWORD:?set POSTGRES_REPORTING_PASSWORD in .env}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-olx_backup}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?set POSTGRES_BACKUP_PASSWORD in .env}
      SUPERSET_META_USER: ${SUPERSET_META_USER:-superset_meta}
      SUPERSET_META_PASSWORD: ${SUPERSET_META_PASSWORD:?set SUPERSET_META_PASSWORD in .env}
      SUPERSET_META_DB: ${SUPERSET_META_DB:-superset_meta}
    volumes:
      # PostgreSQL 18 images require the parent mount so PGDATA can include
      # the major-version directory used by the new image layout.
      - pgdata:/var/lib/postgresql
      - ${DB_INIT_DIR:-./db/init-lean}:/docker-entrypoint-initdb.d:ro # runs on FIRST start only
      - ./backups:/backups # host-visible dump target
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 2g
    memswap_limit: 2g # hit OOM decisively instead of swapping into latency spikes
    cpus: 0.75
    logging: *logging
    # Deliberately NO cap_drop/read_only here: the first-boot entrypoint chowns
    # PGDATA. Isolation comes from attaching db to the backend network ONLY.
    networks:
      - backend
    ports:
      - "127.0.0.1:5432:5432" # host access for psql/GUIs; delete line to keep internal

  # Schema changes run as a completed, one-shot job. Keeping this separate
  # makes deploy order explicit and prevents a normal scraper restart from
  # becoming the migration control plane.
  migrator:
    <<: *scraper-runtime
    # `scrape` activates it automatically as scraper's dependency; `migrate`
    # also permits an explicit schema-only run on the dashboard host.
    profiles: ["migrate", "scrape", "maintenance"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_MIGRATOR_USER:-olx_migrator}:${POSTGRES_MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB:-olx}
      MIGRATION_ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-olx}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-olx}
    working_dir: /app
    entrypoint: ["node", "db/src/migrate-only.js"]

  # Run lean raw-archive retention independently from upstream scraping.
  # Invoke on a host scheduler with --profile maintenance.
  maintenance:
    <<: *scraper-runtime
    profiles: ["maintenance"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-olx_app}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-olx}
      MIGRATIONS_ON_STARTUP: "0"
      RAW_RESPONSE_RETENTION_COUNT: ${RAW_RESPONSE_RETENTION_COUNT:-3}
    working_dir: /app
    entrypoint: ["node", "db/src/maintenance-only.js"]

  scraper:
    <<: *scraper-runtime
    profiles: ["scrape"]
    restart: unless-stopped
    stop_grace_period: 45s
    pids_limit: 64
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-olx_app}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-olx}
      # Migrations are gated by the completed migrator job. Set this to 1
      # only for a deliberately standalone scraper deployment.
      MIGRATIONS_ON_STARTUP: ${MIGRATIONS_ON_STARTUP:-0}
      SCRAPE_INTERVAL_MINUTES: ${SCRAPE_INTERVAL_MINUTES:-720}
      DETAIL_REFRESH_DAYS: ${DETAIL_REFRESH_DAYS:-7}
      MAX_DETAIL_FETCHES: ${MAX_DETAIL_FETCHES:-25}
      DETAIL_CONCURRENCY: ${DETAIL_CONCURRENCY:-2}
      DETAIL_DELAY_MS: ${DETAIL_DELAY_MS:-1200}
      RAW_RESPONSE_RETENTION_COUNT: ${RAW_RESPONSE_RETENTION_COUNT:-3}
      ABANDONED_RUN_AFTER_MINUTES: ${ABANDONED_RUN_AFTER_MINUTES:-180}
      HEALTH_BIND: ${HEALTH_BIND:-0.0.0.0}
    volumes:
      - ./config:/config:ro
    ports:
      - "127.0.0.1:9100:9100" # health/status JSON endpoint
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9100/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s # DB warm-up + first scrape cycle before counting failures
    logging: *logging
    networks:
      - default # egress to olx.ba
      - backend # reach db

  # The React dashboard viewer runs inside Superset. Its metadata
  # database is isolated by database and role inside this existing cluster.
  superset-init:
    profiles: ["superset"]
    image: pik-market-watch-superset:production
    build:
      context: .
      dockerfile: superset/Dockerfile
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *superset-environment
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD in .env}
    volumes:
      - superset_home:/app/superset_home
      - ./superset/init.sh:/app/init.sh:ro
    entrypoint: ["bash", "/app/init.sh"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.5
    networks: [backend]

  superset:
    profiles: ["superset"]
    image: pik-market-watch-superset:production
    build:
      context: .
      dockerfile: superset/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment: *superset-environment
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/superset_config.py:ro
    ports:
      - target: 8088
        published: "3000"
        host_ip: ${SUPERSET_BIND:-127.0.0.1}
        protocol: tcp
        mode: host
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    logging: *logging
    # Keep the database path on the isolated backend while attaching the
    # web container to the host-reachable Compose network for its loopback port.
    networks: [default, backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  superset-seed:
    # Explicit jobs must not race each other during a normal profile startup.
    profiles: ["superset-ops"]
    image: pik-market-watch-superset:production
    build:
      context: .
      dockerfile: superset/Dockerfile
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      superset:
        condition: service_healthy
    environment:
      <<: *superset-environment
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD in .env}
      POSTGRES_REPORTING_USER: ${POSTGRES_REPORTING_USER:-olx_reporting}
      POSTGRES_REPORTING_PASSWORD: ${POSTGRES_REPORTING_PASSWORD:?set POSTGRES_REPORTING_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-olx}
    volumes:
      - ./superset/client.py:/app/client.py:ro
      - ./superset/provisioning.py:/app/provisioning.py:ro
      - ./superset/maps.py:/app/maps.py:ro
      - ./superset/seed.py:/app/seed.py:ro
      - ./superset/listing_filters.py:/app/listing_filters.py:ro
      - ./superset/parity.py:/app/parity.py:ro
      - ./superset/validate_parity.py:/app/validate_parity.py:ro
      - ./superset/dashboards:/app/dashboards:ro
      - ./superset/benchmark.py:/app/benchmark.py:ro
      - ./superset/check_sync.py:/app/check_sync.py:ro
      - ./superset/datasets:/app/datasets:ro
      - ./superset/active-listings.sql:/app/active-listings.sql:ro
    entrypoint: ["python", "/app/seed.py"]
    mem_limit: 1g
    cpus: 0.5
    networks: [backend]

  superset-access:
    profiles: ["superset-ops"]
    image: pik-market-watch-superset:production
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      superset:
        condition: service_healthy
    environment: *superset-environment
    volumes:
      - ./superset/access.py:/app/access.py:ro
      - ./superset/validate_access.py:/app/validate_access.py:ro
      - ./superset/client.py:/app/client.py:ro
      - ./superset/provisioning.py:/app/provisioning.py:ro
      - ./superset/maps.py:/app/maps.py:ro
      - ./superset/listing_filters.py:/app/listing_filters.py:ro
      - ./superset/superset_config.py:/app/superset_config.py:ro
    entrypoint: ["python", "/app/access.py"]
    mem_limit: 1g
    cpus: 0.5
    networks: [backend]

  # Runs every 15 minutes in the alert-checker service. The checker stores its
  # hold/firing state in superset_home and posts transitions only when a
  # webhook is configured.
  superset-alert-check:
    profiles: ["superset"]
    image: pik-market-watch-superset:production
    build:
      context: .
      dockerfile: superset/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *superset-environment
      POSTGRES_REPORTING_USER: ${POSTGRES_REPORTING_USER:-olx_reporting}
      POSTGRES_REPORTING_PASSWORD: ${POSTGRES_REPORTING_PASSWORD:?set POSTGRES_REPORTING_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-olx}
      SCRAPE_STALE_AFTER_HOURS: ${SCRAPE_STALE_AFTER_HOURS:-26}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - superset_home:/app/superset_home
      - ./superset/check_alerts.py:/app/check_alerts.py:ro
      - ./superset/run-alert-checker.sh:/app/run-alert-checker.sh:ro
    entrypoint: ["bash", "/app/run-alert-checker.sh"]
    mem_limit: 512m
    cpus: 0.25
    networks:
      - default # optional alert webhook delivery
      - backend
    healthcheck:
      test: ["CMD-SHELL", "find /app/superset_home/pipeline-alert-state.json -mmin -30 -print -quit | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 45s

  db-backup:
    # Keep pg_dump major-version matched with the database. The PostGIS image
    # is used here only for its PostgreSQL 18 client tools.
    image: ghcr.io/baosystems/postgis:18-3.6@sha256:4117c8beae9081e76a23a1577c64d05260a61fb0a3c212f37596054ef4c190d8
    # The bind-mounted backup directory is owned by the instance checkout user.
    # Override these IDs on hosts with different backups/ ownership.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-989}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Read private files owned by Superset without changing their
    # permissions. Application volumes and the container filesystem stay read-only.
    cap_add: [DAC_READ_SEARCH]
    read_only: true # dumps land on the /backups mount only
    tmpfs:
      - /tmp
    pids_limit: 50
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_BACKUP_USER:-olx_backup} # dedicated broad-read backup role
      PGPASSWORD: ${POSTGRES_BACKUP_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-olx}
      SUPERSET_META_DB: ${SUPERSET_META_DB:-superset_meta}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./db/backup.sh:/usr/local/bin/backup.sh:ro
      - superset_home:/superset-home:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    mem_limit: 256m
    memswap_limit: 256m # hit OOM decisively instead of swapping into latency spikes
    cpus: 0.25
    logging: *logging
    networks:
      - backend
    healthcheck:
      # Semantic check: healthy ⇔ a pg_dump archive exists and is fresh (< 26 h).
      # The loop dumps right after start, so this settles within minutes; a hung
      # loop or silently failing pg_dump flips the sidecar unhealthy instead of
      # dying invisibly.
      test:
        [
          "CMD-SHELL",
          "sh /usr/local/bin/backup.sh --check",
        ]
      interval: 10m
      timeout: 30s
      retries: 3
      start_period: 5m

volumes:
  # Stable deployed volume identities preserve data across checkout renames.
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:-olx-price-ext_pgdata_pg18}
    external: true
  superset_home:
    name: olx-price-ext_superset_home

networks:
  # Segmentation: db joins ONLY `backend`, so anything on the default network
  # (today's and future containers alike) cannot resolve or reach Postgres.
  # Scraper and Superset are dual-homed onto `default` for egress; the database
  # and backend-only jobs use this isolated network for PostgreSQL access.
  backend:
    internal: true
