# Loads every dashboard JSON found in /var/lib/grafana/dashboards
# (mounted from ./grafana/dashboards in docker-compose.yml).
apiVersion: 1

providers:
  - name: olx-dashboards
    orgId: 1
    folder: OLX
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
  - name: olx-public-dashboards
    # Retirement provider: keep this empty, deletion-enabled directory mounted
    # until every deployment has removed the former public dashboards.
    orgId: 1
    folder: Retired public dashboards
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/public-dashboards
      foldersFromFilesStructure: false
