# Grafana reads the migrated tables through the reporting role.
apiVersion: 1

datasources:
  - name: OLX Postgres
    uid: olx-postgres
    type: postgres
    access: proxy
    url: db:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_REPORTING_USER}
    secureJsonData:
      password: $POSTGRES_REPORTING_PASSWORD
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 8
      maxIdleConns: 4
    isDefault: true
    editable: false
