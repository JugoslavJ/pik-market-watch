# Provision the lean dashboard set. Missing dashboards from the former OLX
# provider are removed from Grafana.
apiVersion: 1

providers:
  - name: olx-dashboards
    orgId: 1
    folder: OLX
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
